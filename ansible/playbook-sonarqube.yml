- hosts: sonarqube
  become: true
  tasks:
    # ===== Update Package Repository and Upgrade Packages =====
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Upgrade all packages
      apt:
        upgrade: dist

    # ===== Install PostgreSQL (Ubuntu default, no external repo needed) =====
    - name: Install PostgreSQL and dependencies
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Enable and start PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Verify PostgreSQL version
      shell: psql --version
      register: pg_version
      changed_when: false

    - name: Show PostgreSQL version
      debug:
        var: pg_version.stdout

    # ===== Create Database for SonarQube =====
    - name: Install acl (required for become_user tasks)
      apt:
        name: acl
        state: present

    - name: Create sonar PostgreSQL user
      become_user: postgres
      postgresql_user:
        name: sonar
        password: sonar
        state: present

    - name: Create sonarqube database owned by sonar user
      become_user: postgres
      postgresql_db:
        name: sonarqube
        owner: sonar
        state: present

    - name: Grant all privileges on sonarqube database to sonar user
      become_user: postgres
      postgresql_privs:
        db: sonarqube
        role: sonar
        type: database
        privs: ALL
        state: present

    # ===== Add Adoptium repository =====
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Adoptium GPG key
      get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /etc/apt/keyrings/adoptium.asc

    - name: Add Adoptium repo
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
        state: present
        filename: adoptium

    # ===== Install Java 21 =====
    # NOTE: SonarQube's current LTA (2026.1) and recent Community Builds
    # require Java 21 as the MINIMUM version. Java 17 is no longer
    # sufficient and the server will fail to start on Java 17.
    - name: Install Java 21
      apt:
        name: temurin-21-jdk
        update_cache: yes

    # ===== Linux Kernel Tuning =====
    - name: Set file descriptor limits for sonar user
      pam_limits:
        domain: sonar
        limit_type: '-'
        limit_item: nofile
        value: '65536'

    - name: Set process limits for sonar user
      pam_limits:
        domain: sonar
        limit_type: '-'
        limit_item: nproc
        value: '4096'

    - name: Set vm.max_map_count for Elasticsearch (SonarQube requirement)
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    # ===== SonarQube Installation =====
    - name: Install unzip
      apt:
        name: unzip
        state: present

    # NOTE: This is SonarQube Community Build (free, self-hosted).
    # Version pinned to 25.12.0.117093 - the most recent confirmed
    # Community Build at time of writing. Check
    # https://www.sonarsource.com/products/sonarqube/downloads/
    # for the latest version before deploying, since Sonar ships
    # new builds every ~2 months.
    - name: Set SonarQube version
      set_fact:
        sonarqube_version: "25.12.0.117093"

    - name: Download SonarQube
      get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
        dest: /tmp/sonarqube.zip

    - name: Unzip SonarQube
      unarchive:
        src: /tmp/sonarqube.zip
        dest: /opt
        remote_src: yes
        creates: "/opt/sonarqube-{{ sonarqube_version }}"

    - name: Symlink to /opt/sonarqube
      file:
        src: "/opt/sonarqube-{{ sonarqube_version }}"
        dest: /opt/sonarqube
        state: link

    # ===== Create user and set permissions =====
    - name: Create sonar group
      group:
        name: sonar
        state: present

    - name: Create sonar user
      user:
        name: sonar
        comment: "user to run SonarQube"
        group: sonar
        home: /opt/sonarqube
        system: yes
        shell: /bin/false
        create_home: no

    - name: Set ownership of SonarQube directory
      file:
        path: "/opt/sonarqube-{{ sonarqube_version }}"
        owner: sonar
        group: sonar
        recurse: yes

    # ===== Update SonarQube properties with DB credentials =====
    - name: Configure SonarQube database connection
      lineinfile:
        path: /opt/sonarqube/conf/sonar.properties
        line: "{{ item }}"
        create: yes
      loop:
        - "sonar.jdbc.username=sonar"
        - "sonar.jdbc.password=sonar"
        - "sonar.jdbc.url=jdbc:postgresql://localhost:5432/sonarqube"

    # ===== Create service for SonarQube =====
    - name: Create systemd service for SonarQube
      copy:
        dest: /etc/systemd/system/sonar.service
        content: |
          [Unit]
          Description=SonarQube service
          After=syslog.target network.target

          [Service]
          Type=forking
          ExecStart=/opt/sonarqube/bin/linux-x86-64/sonar.sh start
          ExecStop=/opt/sonarqube/bin/linux-x86-64/sonar.sh stop
          User=sonar
          Group=sonar
          Restart=always
          LimitNOFILE=65536
          LimitNPROC=4096

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    # ===== Start SonarQube and Enable service =====
    - name: Start and enable SonarQube
      systemd:
        name: sonar
        state: started
        enabled: true